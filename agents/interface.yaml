interface:
  display_name: "乔木 DSH 插件开发"
  short_description: "开发、宿主升级兼容、实机验收与公开发布"
  default_prompt: "Use $qiaomu-dsh-dev to inspect the current DSH version and installed package, implement or debug the requested persistent plugin at its Host/Client boundary, then verify source, build, profile and live user behavior separately. Preserve user data and existing profile state. Use the bundled doctor, scaffold, artifact audit and installed-file comparison. For host upgrades, compare published and candidate manifests, optionally use the pinned health CLI for matrix/runtime checks, and keep UI acceptance separate. Prepare an illustrated bilingual README and publish through PR, CI, Release and public clean installation when authorized by the current request or standing user preference. No additional skill installation required."
compatibility:
  adapter_targets: [openai, claude, generic, agent-skills-compatible]
  trust:
    remote_inline_execution: forbid
  permissions:
    file_write: "requested plugin repository or isolated test profile"
    network: "official documentation, required plugin services and authorized publication"
